function show(){if(ix>=qs.length)return fin();const [wk,q]=qs[ix];locked=false;
app.innerHTML=`<div class="bar"><i style="width:${100*ix/qs.length}%"></i></div><div class="meta"><span>Week ${wk} · ${ix+1}/${qs.length}</span><span>Streak ${streak} · Correct ${score}</span></div><div class="card"><h2>${q[0]}</h2>${[1,2,3,4].map(n=>`<button class="opt" data-n="${n-1}"><b>${'ABCD'[n-1]}</b><span>${q[n]}</span></button>`).join('')}<div class="fb" id="fb"></div></div><div class="row"><button class="ghost" id="qt">Quit</button><button class="btn" id="nx2" hidden>${ix+1==qs.length?'Finish':'Next question'}</button></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
document.getElementById('qt').onclick=home;document.getElementById('nx2').onclick=nxt;sayQ()}
function pick(n){if(locked)return;locked=true;const q=qs[ix][1],ok=n==q[5];if(ok){score++;streak++;best=Math.max(best,streak);wrong.delete(key(qs[ix][0],q));saveW();play('ok')}else{streak=0;miss.push([q,n]);wrong.set(key(qs[ix][0],q),[qs[ix][0],q]);saveW();play('no')}
document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.n==q[5])o.classList.add('ok');else if(+o.dataset.n==n)o.classList.add('no')});
document.getElementById('fb').textContent=ok?'Correct.':'Incorrect. The right answer is '+'ABCD'[q[5]]+'.';document.getElementById('nx2').hidden=false;if(window.speechSynthesis&&tts)speechSynthesis.cancel()}
function nxt(){ix++;show()}
function fin(){const p=Math.round(100*score/qs.length);play('end');if(window.speechSynthesis)speechSynthesis.cancel();
app.innerHTML=`<div class="card"><h2>${p>=80?'Strong result':p>=50?'Solid effort':'Worth another pass'}</h2><p class="big">${score} / ${qs.length}</p><p>${p}% correct · Longest streak ${best}</p><div class="row" style="justify-content:flex-start;gap:10px"><button class="btn" id="again">Try again</button>${wrong.size?`<button class="ghost" id="rv2">Review missed (${wrong.size})</button>`:''}<button class="ghost" id="hm">Home</button></div></div>${miss.length?`<div class="card" style="margin-top:12px"><h2>Review (${miss.length} missed)</h2>${miss.map(([q,n])=>`<div class="rv"><b>${q[0]}</b><br>Your answer: ${q[n+1]}<br><em>Correct: ${q[q[5]+1]}</em></div>`).join('')}</div>`:''}`;
document.getElementById('again').onclick=()=>start(lastRev);document.getElementById('hm').onclick=home;const r2=document.getElementById('rv2');if(r2)r2.onclick=()=>start(true)}
document.addEventListener('keydown',e=>{if(!document.querySelector('.opt'))return;const n='abcd1234'.indexOf(e.key.toLowerCase());if(n>=0&&!locked)pick(n%4);else if(e.key=='Enter'&&locked)nxt()});
home();
</script>
<script>
let res=[];
const L=n=>'ABCD'[n];
const ticks=()=>`<div class="ticks">${qs.map((_,k)=>`<i class="${k<res.length?(res[k]?'y':'n'):k==ix?'cur':''}"></i>`).join('')}</div>`;
let t0=0,tid=null,onlyW=false,hist=[],bests={};try{hist=JSON.parse(localStorage.getItem('mhHist')||'[]')}catch(e){}try{bests=JSON.parse(localStorage.getItem('mhBest')||'{}')}catch(e){}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const bkey=()=>lastRev?null:sel;
function tick(){const e=document.getElementById('tm');if(e){const k=bkey();e.textContent='Time '+fmt(Math.floor((Date.now()-t0)/1000))+(k!=null&&bests[k]!=null?' \u00b7 Best '+fmt(bests[k]):'')}}
function go(rev){res=[];t0=Date.now();clearInterval(tid);start(rev);tid=setInterval(tick,1000)}
function home(){clearInterval(tid);if(window.speechSynthesis)speechSynthesis.cancel();
app.innerHTML=`<div class="home"><div><img class="art" src="${IMG}" alt="Illustration of a head in profile with a small plant growing inside it"><h2 class="lede">${Object.values(D).flat().length} questions across Weeks 1 to 12.</h2><p class="mut">Pick a week from the list. Each answer is shown as soon as you choose it.</p><label><input type="checkbox" id="s2" ${shuf?'checked':''}> Shuffle question order</label><label><input type="checkbox" id="s3" ${shufO?'checked':''}> Shuffle answer options</label><label><input type="checkbox" id="s4" ${onlyW?'checked':''}> Practice only my wrong answers when I pick a week</label></div><div><ol class="list"><li><button data-k="rev" ${wrong.size?'':'disabled'}><span>Practice wrong answers</span><span>${wrong.size}</span></button></li><li><button data-k="all"><span>All weeks</span><span>${Object.values(D).flat().length} questions${bests.all!=null?' · best '+fmt(bests.all):''}</span></button></li></ol><p class="mut" style="margin:18px 0 8px">Or choose a week</p><ol class="weeks">${Object.keys(D).map(k=>`<li><button data-k="${k}"><small>Week</small><b>${k}</b>${bests[k]!=null?`<small>${fmt(bests[k])}</small>`:''}</button></li>`).join('')}</ol><p id="note" class="mut" style="min-height:1.6em;margin:10px 0 0"></p>${hist.length?`<details class="hist"><summary>Timer history</summary>${hist.map(h=>`<div class="hrow"><span>${h.s}</span><span>${h.c}/${h.n} · ${fmt(h.t)}</span><span>${new Date(h.d).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span></div>`).join('')}<button class="link" id="clr">Clear history</button></details>`:''}</div></div>`;
document.getElementById('s2').onchange=e=>shuf=e.target.checked;document.getElementById('s3').onchange=e=>shufO=e.target.checked;document.getElementById('s4').onchange=e=>onlyW=e.target.checked;const cl=document.getElementById('clr');if(cl)cl.onclick=()=>{hist=[];try{localStorage.removeItem('mhHist')}catch(e){}home()};
document.querySelectorAll('.list button,.weeks button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='rev')return go(true);sel=k;if(onlyW){const n=[...wrong.values()].filter(v=>k=='all'||v[0]==k).length;if(!n){document.getElementById('note').textContent='No wrong answers saved for '+(k=='all'?'any week':'Week '+k)+' yet.';return}return go('w')}go(false)})}
function show(){if(ix>=qs.length)return fin();const [wk,q]=qs[ix];locked=false;
app.innerHTML=`<div class="qhead"><span>Week ${wk} · Question ${ix+1} of ${qs.length} · <span id="tm"></span></span><button class="link" id="qt">Back to list</button></div>${ticks()}<h2 class="qtext">${q[0]}</h2><div class="opts">${[1,2,3,4].map(n=>`<button class="opt" data-n="${n-1}"><b>${L(n-1)}</b><span>${q[n]}</span></button>`).join('')}</div><div id="fb"></div><button class="next" id="nx2" hidden>${ix+1==qs.length?'See result':'Next question'}</button>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
document.getElementById('qt').onclick=home;document.getElementById('nx2').onclick=nxt;tick();sayQ()}
function pick(n){if(locked)return;locked=true;const q=qs[ix][1],ok=n==q[5];
if(ok){score++;streak++;best=Math.max(best,streak);wrong.delete(key(qs[ix][0],q))}else{streak=0;miss.push([q,n]);wrong.set(key(qs[ix][0],q),[qs[ix][0],q])}
saveW();res[ix]=ok;play(ok?'ok':'no');if(window.speechSynthesis&&tts)speechSynthesis.cancel();
document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const m=+o.dataset.n;if(m==q[5])o.classList.add('ok');else if(m==n)o.classList.add('no')});
document.getElementById('fb').innerHTML=ok?'<p class="verdict">Correct.</p>':`<p class="verdict">The answer is ${L(q[5])}.</p>`;
document.querySelector('.ticks').outerHTML=ticks();document.getElementById('nx2').hidden=false}
function fin(){const p=Math.round(100*score/qs.length);clearInterval(tid);const el=Math.floor((Date.now()-t0)/1000),k=bkey(),prev=k!=null?bests[k]:undefined,nb=k!=null&&(prev==null||el<prev);if(nb){bests[k]=el;try{localStorage.setItem('mhBest',JSON.stringify(bests))}catch(e){}}hist.unshift({s:lastRev==='w'?'Wrong only · '+(sel=='all'?'all weeks':'Week '+sel):lastRev?'Missed questions':sel=='all'?'All weeks':'Week '+sel,t:el,c:score,n:qs.length,d:Date.now()});hist.length=Math.min(hist.length,30);try{localStorage.setItem('mhHist',JSON.stringify(hist))}catch(e){}play('end');if(window.speechSynthesis)speechSynthesis.cancel();
app.innerHTML=`<p class="mut">Finished</p><h2 class="score">${score} of ${qs.length} correct</h2>${ticks()}<p>${p}% · longest streak ${best}</p><p>Time ${fmt(el)}${k==null?'':nb?' · new best time':' · best '+fmt(prev)}</p><div class="acts"><button class="next" id="again">Go again</button>${wrong.size?`<button class="link" id="rv2">Review missed (${wrong.size})</button>`:''}<button class="link" id="hm">Back to list</button></div>${miss.length?`<h2 class="lede" style="font-size:1.2rem">Missed this round</h2>${miss.map(([q,n])=>`<div class="rv"><b>${q[0]}</b><br>Your answer: ${q[n+1]}<br><em>Correct: ${q[q[5]+1]}</em></div>`).join('')}`:''}`;
document.getElementById('again').onclick=()=>go(lastRev);document.getElementById('hm').onclick=home;const r2=document.getElementById('rv2');if(r2)r2.onclick=()=>go(true)}
home();
</script></body></html>
